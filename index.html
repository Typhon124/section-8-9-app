<body>
<header>
 <div class="brand"><i>⚡</i>Section Lab<span style="color:var(--mu);font-weight:500;font-size:13px">&nbsp;· Tutorials 08 &amp; 09</span></div>
 <nav id="tabs"><button>T8 · Q1</button><button>T8 · Q6</button><button>T8 · Q7</button><button>T9 · Q3</button><button>T9 · Q4</button><button>T9 · Q10</button></nav>

<main>
 <div id="stage"><canvas id="c" aria-label="Interactive 3D view"></canvas><div id="hud"></div><div id="toast"></div><div id="tip"></div><button id="rv">⟲ View</button></div>

<canvas id="fx"></canvas>
<script>
"use strict";
/* ================= helpers ================= */
const $=i=>document.getElementById(i),PI=Math.PI,K=8.9875517923e9,E0=8.8541878128e-12;
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len=a=>Math.hypot(a[0],a[1],a[2]),norm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fib=(N,i)=>{const y=1-2*(i+.5)/N,r=Math.sqrt(Math.max(0,1-y*y)),p=i*2.399963;return[r*Math.cos(p),y,r*Math.sin(p)]};
const dirTP=(t,p)=>[Math.sin(t)*Math.cos(p),Math.cos(t),Math.sin(t)*Math.sin(p)];
const sci=x=>{if(Math.abs(x)<1e-300)return'0';const[m,e]=x.toExponential(2).split('e');return m+' × 10<sup>'+(+e)+'</sup>'};
const f=(x,d=1)=>(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d);
const sl=(id,t,a,b,s,v,u)=>`<label class="s"><span>${t}</span><output id="o_${id}">${v} ${u}</output><input type="range" id="${id}" min="${a}" max="${b}" step="${s}" value="${v}" data-u="${u}"></label>`;
const setS=(id,x)=>{const e=$(id);if(!e)return;e.value=x;$('o_'+id).textContent=e.value+' '+e.dataset.u};
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};

/* ================= storage, sound, toast, confetti ================= */
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('fluxlab-stars')||'[]'))}catch(e){}
const saveDone=()=>{try{localStorage.setItem('fluxlab-stars',JSON.stringify([...done]))}catch(e){}};
let AC=null,sndOn=true;
try{sndOn=localStorage.getItem('fluxlab-snd')!=='0'}catch(e){}
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(fq,d=.08,type='sine',v=.04,delay=0){if(!sndOn)return;const a=au();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(1e-4,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const chime=()=>[523,659,784,1047,1319].forEach((q,i)=>tone(q,.3,'triangle',.06,i*.07));
const pop=()=>{tone(300,.12,'square',.03);tone(150,.18,'sine',.05,.03)};
$('snd').onclick=()=>{sndOn=!sndOn;$('snd').textContent=sndOn?'🔊':'🔇';try{localStorage.setItem('fluxlab-snd',sndOn?'1':'0')}catch(e){}if(sndOn)tone(660,.1,'triangle',.05)};
$('snd').textContent=sndOn?'🔊':'🔇';
let toastT=0;function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
const fx=$('fx'),fxc=fx.getContext('2d');let conf=[];
function confetti(n=140){const r=$('stage').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.35,cols=['#ffd54f','#ff5a6a','#4fd1ff','#3ddc97','#b388ff','#ff9f43'];
 for(let i=0;i<n;i++){const a=Math.random()*2*PI,s=4+Math.random()*9;conf.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*PI,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],w:5+Math.random()*6,l:1})}}
function fxFrame(){if(!conf.length&&!fx._on)return;const W=innerWidth,H=innerHeight;if(fx.width!==W||fx.height!==H){fx.width=W;fx.height=H}fxc.clearRect(0,0,W,H);fx._on=conf.length>0;
 conf=conf.filter(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.009;fxc.save();fxc.globalAlpha=Math.max(0,p.l);fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.fillStyle=p.c;fxc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fxc.restore();return p.l>0&&p.y<H+20})}

/* ================= 3D engine on a 2D canvas ================= */
const cv=$('c'),ctx=cv.getContext('2d');let W=300,H=300,DPR=1,DPRMAX=2,QL=1;
const TOUCH=matchMedia('(pointer:coarse)').matches,mob=()=>W<560||H<420;
function resize(){const r=$('stage').getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,DPRMAX);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
new ResizeObserver(resize).observe($('stage'));resize();
const cam={az:.85,el:.38,dist:13,fov:45};let eye,fw,rt,upv,foc;
function camUpdate(){const{az,el,dist}=cam;eye=[dist*Math.cos(el)*Math.cos(az),dist*Math.sin(el),dist*Math.cos(el)*Math.sin(az)];fw=norm(scl(eye,-1));rt=norm(cross(fw,[0,1,0]));upv=cross(rt,fw);foc=Math.min(H,W*1.25)/2/Math.tan(cam.fov*PI/360)}
function P(p){const d=sub3(p,eye),z=dot(d,fw);if(z<.3)return null;const s=foc/z;return[W/2+dot(d,rt)*s,H/2-dot(d,upv)*s,z,s]}
function hitY(sx,sy,y0=0){const d=norm(add3(fw,add3(scl(rt,(sx-W/2)/foc),scl(upv,-(sy-H/2)/foc))));if(Math.abs(d[1])<1e-4)return null;const t=(y0-eye[1])/d[1];return t>0?add3(eye,scl(d,t)):null}
const glowC={};
function sprite(col){if(glowC[col])return glowC[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.15,col);gr.addColorStop(.45,hex2(col,.35));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return glowC[col]=c}
function glow(sp,r,col,a=1){if(!sp)return;ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(sprite(col),sp[0]-r,sp[1]-r,2*r,2*r);ctx.globalAlpha=1}
function line3(a,b,col,w=1,al=1){const p=P(a),q=P(b);if(!p||!q)return;ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.globalAlpha=1}
function poly3(pts,fill,stroke,w=1,dash){const q=pts.map(P);if(q.some(x=>!x))return;ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.setLineDash(dash||[]);ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();ctx.setLineDash([])}}
function arrow(o,d,L,col,w=2.5,al=1){const p0=P(o),p1=P(add3(o,scl(d,L)));if(!p0||!p1)return null;const dx=p1[0]-p0[0],dy=p1[1]-p0[1],l=Math.hypot(dx,dy);if(l<2)return p1;
 const ux=dx/l,uy=dy/l,hs=Math.min(l*.5,clamp(p1[3]*.22,6,15));ctx.globalAlpha=al;ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';

  explore:()=>sl('R7','Sphere radius R',.2,3,.05,Q7.R,'m')+`<div class="row"><span class="t">Radius:</span><button onclick="q7R(.5)">(a) 0.500 m</button><button onclick="q7R(1.5)">(b) 1.50 m</button><button onclick="q7R(2.5)">(c) 2.50 m</button></div>`,
  input:t=>{if(t.id=='R7')Q7.R=+t.value},
  asks:[{id:'q7a',label:'(a) Φ for R = 0.500 m',type:'num',ans:0,abs:1,unit:'N·m²/C',hint:'Compare each distance with R: is anything inside?'},{id:'q7b',label:'(b) Φ for R = 1.50 m',type:'num',ans:-678,tol:.015,unit:'N·m²/C',hint:'Only q₂ (d = 1.00 m) is inside. Keep its sign.'},{id:'q7c',label:'(c) Φ for R = 2.50 m',type:'num',ans:-226,tol:.015,unit:'N·m²/C',hint:'Both are inside: (q₁ + q₂)/ε₀.'}],
  steps:[['Rule','d₁ = 2.00 m (q₁), d₂ = 1.00 m (q₂). Φ = q<sub>in</sub>/ε₀; a charge is enclosed only if d &lt; R'],['(a) R = 0.500 m','Both d > R → q<sub>in</sub> = 0 → <b class="ans">Φ = 0</b>'],['(b) R = 1.50 m','Only q₂ inside: Φ = (−6.00 × 10⁻⁹)/(8.85 × 10⁻¹²) = <b class="ans">−678 N·m²/C</b>'],['(c) R = 2.50 m','Both inside: Φ = (4.00 − 6.00) × 10⁻⁹/(8.85 × 10⁻¹²) = <b class="ans">−226 N·m²/C</b>']]},
 {id:'t9q3',tip:'Switch parts (a)(b)(c) · drag to orbit',short:'T9 · Q3',tag:'Tutorial 09 · Question 3',title:'The ratio trick',cam:[PI/2-.3,.28,8.5,1.3],frame:q3Frame,hud:q3HUD,pick:()=>null,hover:()=>false,chk:CHK9,
  q:'(a) A conducting sphere has charge Q and radius R. If E at r = 2R is 1400 N/C, what is E at r = 4R? (b) A very long conducting cylinder of radius R has charge per unit length λ. If E at r = 2R is 1400 N/C, what is E at r = 4R? (c) A very large uniform sheet has surface charge density σ. If E is 1400 N/C at distance d, what is E at distance 2d?',
  explore:()=>`<div class="row"><span class="t">Part:</span><button data-pt="a" onclick="q3P('a')">(a) Sphere</button><button data-pt="b" onclick="q3P('b')">(b) Cylinder</button><button data-pt="c" onclick="q3P('c')">(c) Sheet</button></div>`+sl('k3','Second point: r = k·R  (sheet: k/2 · d)',2.4,7,.1,Q3.k,'')+`<div class="card"><b>E versus distance</b><canvas id="pl" width="340" height="120"></canvas></div>`,
  input:t=>{if(t.id=='k3')Q3.k=+t.value},init:()=>q3P(Q3.part,1),
  asks:[{id:'q3a',label:'(a) E at 4R (sphere)',type:'num',ans:350,tol:.01,unit:'N/C',hint:'E ∝ 1/r²: doubling r divides E by 4.'},{id:'q3b',label:'(b) E at 4R (cylinder)',type:'num',ans:700,tol:.01,unit:'N/C',hint:'E ∝ 1/r: doubling r divides E by 2.'},{id:'q3c',label:'(c) E at 2d (sheet)',type:'num',ans:1400,tol:.01,unit:'N/C',hint:'E = σ/2ε₀: is there a distance in it?'}],
  steps:[['(a) Sphere (outside)','E = kQ/r² → E₂/E₁ = (r₁/r₂)² → E₂ = 1400 (2R/4R)² = <b class="ans">350 N/C</b>'],['(b) Long cylinder','E = λ/(2πε₀r) → E₂/E₁ = r₁/r₂ → E₂ = 1400 × 2R/4R = <b class="ans">700 N/C</b>'],['(c) Very large sheet','E = σ/(2ε₀) does not depend on distance → <b class="ans">E₂ = 1400 N/C</b>']]},
 {id:'t9q4',tip:'Drag P up and down the y-axis',short:'T9 · Q4',tag:'Tutorial 09 · Question 4',title:'Two parallel lines of charge',cam:[PI/2,.12,10.5,1.4],frame:q4Frame,hud:q4HUD,pick:q4Pick,hover:q4Near,chk:CHK9,
  q:'A very long uniform line of charge has λ = 4.80 μC/m and lies along the x-axis. A second long line has λ = −2.40 μC/m and is parallel to the x-axis at y = 0.400 m. What is the net electric field (magnitude and direction) at the points on the y-axis (a) y = 0.200 m and (b) y = 0.600 m?',
  explore:()=>sl('y4','Point P on the y-axis',-.4,1,.005,Q4.y,'m')+`<div class="row"><span class="t">Go to:</span><button onclick="q4G(.2)">a (0.200 m)</button><button onclick="q4G(.6)">b (0.600 m)</button></div><p class="z">Drag P up and down. + line: E points away. − line: E points toward.</p>`,
  input:t=>{if(t.id=='y4')Q4.y=+t.value},
  asks:[{id:'q4a',label:'(a) |E| at y = 0.200 m',type:'num',ans:647.4,tol:.015,unit:'kN/C',hint:'E = λ/(2πε₀r), r = 0.2 m from both lines. Do E₁ and E₂ point the same way here?'},{id:'q4ad',label:'(a) Direction',type:'choice',opts:['+y (up)','−y (down)'],ans:0,hint:'E₁ points away from line 1, E₂ toward line 2.'},
   {id:'q4b',label:'(b) |E| at y = 0.600 m',type:'num',ans:71.93,tol:.02,unit:'kN/C',hint:'r₁ = 0.6 m, r₂ = 0.2 m. Opposite directions: subtract.'},{id:'q4bd',label:'(b) Direction',type:'choice',opts:['+y (up)','−y (down)'],ans:1,hint:'Which field is bigger at b?'}],
  steps:[['Formula','E = λ/(2πε₀r): + line → E away, − line → E toward'],['(a) y = 0.200 m','r₁ = r₂ = 0.2 m. E₁ = 431.6 kN/C (+ĵ), E₂ = 215.8 kN/C (+ĵ)<br>E<sub>a</sub> = 431.6 + 215.8 = <b class="ans">647.4 kN/C, +y</b>'],['(b) y = 0.600 m','r₁ = 0.6 m, r₂ = 0.2 m. E₁ = 143.9 kN/C (+ĵ), E₂ = 215.8 kN/C (−ĵ)<br>E<sub>b</sub> = 143.9 − 215.8 = −71.93 → <b class="ans">71.93 kN/C, −y</b>']]},
 {id:'t9q10',tip:'Drag the green circle through the regions',short:'T9 · Q10',tag:'Tutorial 09 · Question 10',title:'Two concentric conducting shells',cam:[-.6,.4,9,1.0],frame:q10Frame,hud:q10HUD,pick:q10Pick,hover:q10Near,chk:CHK9,
  q:'A small conducting spherical shell with inner radius a and outer radius b is concentric with a larger conducting spherical shell with inner radius c and outer radius d. The inner shell has total charge +2q, and the outer shell has charge +4q. Calculate E (magnitude and direction) in terms of q and r for (a) r < a; (b) a < r < b; (c) b < r < c; (d) c < r < d; (e) r > d. Graph the radial component of E as a function of r.',
  explore:()=>sl('r10','Gaussian sphere radius r',.1,3.2,.02,Q10.r,'')+`<p class="z">Drag the green Gaussian sphere through the five regions. Answer a region to see its field arrows.</p><div class="card" id="g10" style="display:none"><b>E<sub>r</sub> versus r</b><canvas id="pl" width="340" height="120"></canvas></div>`,
  input:t=>{if(t.id=='r10')Q10.r=+t.value},
  asks:'abcde'.split('').map((L,i)=>({id:'q10'+L,label:`(${L}) ${['r < a','a < r < b','b < r < c','c < r < d','r > d'][i]}`,type:'choice',opts:['E = 0','E = 2kq/r²','E = 4kq/r²','E = 6kq/r²'],ans:[0,0,1,0,3][i],hint:['No charge inside the cavity.','Inside conducting material.','Only the inner shell (+2q) is enclosed.','Inside conducting material again.','All the charge: 2q + 4q.'][i]})).concat([{id:'q10dir',label:'Direction where E ≠ 0',type:'choice',opts:['Radially outward','Radially inward'],ans:0,hint:'All the enclosed charge is positive.'}]),
  steps:[['Method','Gaussian sphere of radius r: E(4πr²) = q<sub>in</sub>/ε₀ → E = kq<sub>in</sub>/r²'],['(a) r < a','Empty cavity: q<sub>in</sub> = 0 → <b class="ans">E = 0</b>'],['(b) a < r < b','Inside the inner conductor → <b class="ans">E = 0</b> (+2q sits on the outer surface r = b)'],['(c) b < r < c','q<sub>in</sub> = +2q → <b class="ans">E = 2kq/r², radially outward</b>'],['(d) c < r < d','Conducting material → <b class="ans">E = 0</b>, so r = c holds −2q and r = d holds 4q + 2q = +6q'],['(e) r > d','q<sub>in</sub> = 2q + 4q = 6q → <b class="ans">E = 6kq/r², radially outward</b>'],['Graph','Zero for r < b, jumps to 2kq/b² at r = b and falls as 1/r², zero for c < r < d, jumps to 6kq/d² at r = d and falls as 1/r²']]}];
function q1S(s,quiet){Q1.shape=s;document.querySelectorAll('[data-shp]').forEach(b=>b.classList.toggle('on',b.dataset.shp==s));if(!quiet)tone(520,.07,'triangle',.04)}
function q1T(d){Q1.th=d;setS('th1',d)}
function q7R(r){Q7.R=r;setS('R7',r);tone(500+r*100,.08,'triangle',.04)}
function q3P(k,quiet){Q3.part=k;document.querySelectorAll('[data-pt]').forEach(b=>b.classList.toggle('on',b.dataset.pt==k));if(!quiet)tone(520,.07,'triangle',.04)}
function q4G(y){Q4.y=y;setS('y4',y)}

function askHTML(p){return p.asks.map(a=>{const ok=SOLVED.has(a.id);return`<div class="ask ${ok?'ok':''}" id="ask_${a.id}"><label>${a.label}</label><div class="arow">${a.type=='choice'?`<select id="in_${a.id}"><option value="">choose…</option>${a.opts.map((o,i)=>`<option value="${i}" ${ok&&i===a.ans?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="in_${a.id}" type="text" inputmode="decimal" placeholder="your answer" autocomplete="off" value="${ok?(a.show??a.ans):''}"><span class="u">${a.unit||''}</span>`}<button onclick="check('${p.id}','${a.id}')">Check</button></div><div class="fb" id="fb_${a.id}">${ok?'<b style="color:#3ddc97">✓ Correct</b>':''}</div></div>`}).join('')}
function check(pid,aid){const p=PR.find(x=>x.id==pid),a=p.asks.find(x=>x.id==aid),el=$('in_'+aid),fb=$('fb_'+aid);
 if(el.value===''){fb.innerHTML='<span class="z">Enter an answer first.</span>';return}
 let ok;if(a.type=='choice')ok=+el.value===a.ans;else{const v=pnum(el.value);ok=isFinite(v)&&(a.ans===0?Math.abs(v)<=(a.abs||.5):Math.abs(v-a.ans)<=Math.abs(a.ans)*(a.tol||.02))}
 if(ok){SOLVED.add(aid);saveS();fb.innerHTML='<b style="color:#3ddc97">✓ Correct!</b>';$('ask_'+aid).classList.add('ok');tone(880,.12,'triangle',.05)}
 else{fb.innerHTML=`<b style="color:#ff8a96">✗ Not yet.</b> <span class="z">Hint: ${a.hint}</span>`;$('ask_'+aid).classList.remove('ok');tone(220,.15,'sine',.04)}
 if(p.asks.every(x=>SOLVED.has(x.id))&&!SOLVED.has(p.id)){SOLVED.add(p.id);saveS();toast('★ '+p.short+' solved!');confetti();chime();navUI();updStars();const s=$('sol');if(s)s.open=true}}
function reveal(){const p=PR[cur];p.rev=true;const s=$('sol');if(s){s.open=true;s.scrollIntoView({behavior:'smooth',block:'start'})}tone(440,.1,'triangle',.04)}
const pPanel=p=>`<div class="tagl">${p.tag}</div><h2>${p.title}</h2><div class="card qtext">${p.q}</div>
<div class="card"><b>🔍 Explore</b>${p.explore()}</div>
<div class="card"><b>✏️ Your answers</b> <span class="z">Predict first, then check.</span>${askHTML(p)}<div class="row"><button onclick="reveal()">Show answers &amp; solution</button></div></div>
<details id="sol" ${isRev(p)?'open':''}><summary>Full solution</summary>${p.steps.map(([t,m],i)=>`<div class="stp"><span class="n">${i+1}</span><div><b>${t}</b><div class="m">${m}</div></div></div>`).join('')}</details>${p.chk}`;
function navUI(){document.querySelectorAll('#tabs button').forEach((b,i)=>{b.classList.toggle('on',i==cur);b.classList.toggle('done',SOLVED.has(PR[i].id))})}
function updStars(){$('stars').textContent=`★ ${PR.filter(p=>SOLVED.has(p.id)).length}/${PR.length}`}
function resetCam(){const c=PR[cur].cam,narrow=W<H;[cam.az,cam.el,cam.dist]=[c[0],c[1],c[2]*(narrow?c[3]:1)]}
function goP(i){cur=i;const p=PR[i];$('pn').innerHTML=pPanel(p);$('pn').scrollTop=0;if(p.init)p.init();navUI();resetCam();
 $('tip').textContent=p.tip;$('tip').classList.remove('hide');
 try{history.replaceState(null,'','#'+p.id)}catch(e){}}

/* ================= wiring ================= */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=[...$('tabs').children].indexOf(b);goP(i);tone(600,.06,'triangle',.03)});
$('rv').onclick=resetCam;
$('pn').addEventListener('input',e=>{const t=e.target;if(t.type=='range'){$('o_'+t.id).textContent=t.value+' '+t.dataset.u;const p=PR[cur];if(p.input)p.input(t)}});
$('pn').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id&&e.target.id.startsWith('in_')){const b=e.target.parentElement.querySelector('button');if(b)b.click()}});
const ptr=new Map();let pd=0,handler=null;
cv.addEventListener('pointerdown',e=>{au();$('tip').classList.add('hide');cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ptr.set(e.pointerId,[x,y]);
 if(ptr.size==1){handler=PR[cur].pick(x,y);cv.style.cursor='grabbing'}else{if(handler&&handler.up)handler.up();handler=null}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,o=ptr.get(e.pointerId);
 if(!o){cv.style.cursor=PR[cur].hover(x,y)?'pointer':'grab';return}
 if(ptr.size==1){if(handler)handler.move(x,y);else{cam.az-=(x-o[0])*.008;cam.el=clamp(cam.el+(y-o[1])*.008,-1.35,1.35)}}
 ptr.set(e.pointerId,[x,y]);if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)cam.dist=clamp(cam.dist*pd/d,2.5,32);pd=d}});
const pup=e=>{ptr.delete(e.pointerId);pd=0;if(!ptr.size){if(handler&&handler.up)handler.up();handler=null;cv.style.cursor='grab'}};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.001),2.5,32)},{passive:false});
let last=performance.now(),fr=0,ftSum=0,ftN=0;
function loop(now){requestAnimationFrame(loop);const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;fr++;
 if(!document.hidden&&raw<.25){ftSum+=raw;ftN++;if(ftN>=90){const avg=ftSum/ftN;ftSum=ftN=0;if(avg>.03&&QL>.5){QL-=.25;if(DPRMAX>1){DPRMAX=Math.max(1,DPRMAX-.5);resize()}}}}
 camUpdate();ctx.clearRect(0,0,W,H);PR[cur].frame(dt,now/1000);if(fr%5==0)PR[cur].hud(PR[cur]);fxFrame()}
updStars();const h0=(location.hash||'').slice(1),i0=PR.findIndex(p=>p.id==h0);goP(i0>=0?i0:0);requestAnimationFrame(loop);
window.addEventListener('hashchange',()=>{const i=PR.findIndex(p=>p.id==location.hash.slice(1));if(i>=0&&i!=cur)goP(i)});
</script></body></html>
